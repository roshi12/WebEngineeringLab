<!DOCTYPE html>
<html>
<head>
<title>Abdullah Roshaan's Image Gallery Sorter</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f3f4f6;
    text-align:center;
}

header{
    background:#1e293b;
    color:white;
    padding:18px;
}

.controls{
    margin:20px;
}

input{
    padding:8px;
    width:260px;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:8px 14px;
    margin:5px;
    border:none;
    border-radius:18px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#2563eb;
}

#gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    cursor:pointer;
    transition:transform .2s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card p{
    padding:10px;
    margin:0;
    font-weight:bold;
}

.modal{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
}

.modal img{
    width:60%;
    max-width:600px;
    border-radius:10px;
}

.hidden{
    display:none;
}

#close{
    position:absolute;
    top:25px;
    right:40px;
    font-size:30px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>Abdullah Roshaan's Image Gallery Sorter</h1>
</header>

<div class="controls">

<input id="imageLink" placeholder="Paste image URL">

<button id="addBtn">Add Image</button>

<br>

<button data-filter="all">All</button>
<button data-filter="Nature">Nature</button>
<button data-filter="Architecture">Architecture</button>
<button data-filter="Animals">Animals</button>

</div>

<div id="gallery"></div>

<div id="modal" class="modal hidden">
<span id="close">&times;</span>
<img id="modalImage">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
</div>

<script>

const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalImage = document.getElementById("modalImage");
const modalTitle = document.getElementById("modalTitle");
const modalDesc = document.getElementById("modalDesc");

const imageInput = document.getElementById("imageLink");
const addButton = document.getElementById("addBtn");

const closeButton = document.getElementById("close");

let images = [];


/* Decide category from URL keywords */
function detectCategory(url){

    const lower = url.toLowerCase();

    if(lower.includes("lion") || lower.includes("dog") || lower.includes("cat") || lower.includes("animal")){
        return "Animals";
    }

    if(lower.includes("building") || lower.includes("city") || lower.includes("bridge")){
        return "Architecture";
    }

    return "Nature";
}


/* Render gallery items */
function renderGallery(list){

    gallery.innerHTML = "";

    list.forEach((img,index)=>{

        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.index = index;

        const image = document.createElement("img");
        image.src = img.url;

        const title = document.createElement("p");
        title.textContent = img.title;

        card.appendChild(image);
        card.appendChild(title);

        gallery.appendChild(card);

    });

}


/* Add image from URL */
function addImage(){

    const url = imageInput.value.trim();

    if(url === ""){
        alert("Please enter an image link.");
        return;
    }

    if(!url.startsWith("http")){
        alert("Please enter a valid URL.");
        return;
    }

    const category = detectCategory(url);

    const newImage = {
        url: url,
        title: category + " Image",
        desc: "Automatically categorized as " + category,
        category: category
    };

    images.push(newImage);

    renderGallery(images);

    imageInput.value = "";

}


/* Gallery click (event delegation) */
gallery.addEventListener("click",function(event){

    const card = event.target.closest(".card");

    if(!card) return;

    const index = card.dataset.index;

    const selected = images[index];

    modalImage.src = selected.url;
    modalTitle.textContent = selected.title;
    modalDesc.textContent = selected.desc;

    modal.classList.remove("hidden");

});


/* Close modal */
closeButton.onclick = function(){
    modal.classList.add("hidden");
};


/* Filter buttons */
document.querySelector(".controls").addEventListener("click",function(e){

    if(e.target.dataset.filter === undefined) return;

    const filter = e.target.dataset.filter;

    if(filter === "all"){
        renderGallery(images);
        return;
    }

    const filtered = images.filter(function(img){
        return img.category === filter;
    });

    renderGallery(filtered);

});


addButton.onclick = addImage;

</script>

</body>
</html>
