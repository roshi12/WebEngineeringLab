<!DOCTYPE html>
<html>
<head>
<title>Abdullah Roshaan's Interactive Quiz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f3f4f6;
    text-align:center;
    margin:0;
}

header{
    background:#1e293b;
    color:white;
    padding:18px;
}

#quizBox{
    background:white;
    width:500px;
    margin:40px auto;
    padding:25px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.option{
    display:block;
    margin:10px 0;
    padding:10px;
    background:#e5e7eb;
    border-radius:6px;
    cursor:pointer;
}

.option:hover{
    background:#d1d5db;
}

button{
    padding:10px 16px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    background:#3b82f6;
    color:white;
    cursor:pointer;
}

#progressContainer{
    width:80%;
    height:18px;
    background:#e5e7eb;
    margin:20px auto;
    border-radius:10px;
}

#progressBar{
    height:100%;
    width:0%;
    background:#22c55e;
    border-radius:10px;
}

table{
    width:90%;
    margin:30px auto;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border:1px solid #ccc;
}

.correct{
    background:#bbf7d0;
}

.wrong{
    background:#fecaca;
}

</style>
</head>

<body>

<header>
<h1>Abdullah Roshaan's Interactive Quiz</h1>
</header>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<div id="quizBox">
<h2 id="question"></h2>
<div id="options"></div>
<button id="nextBtn">Next</button>
</div>

<div id="scoreboard"></div>

<script>

const questions = [

{
q:"Which language runs in a web browser?",
options:["Python","Java","C","JavaScript"],
answer:"JavaScript"
},

{
q:"Which company developed JavaScript?",
options:["Microsoft","Netscape","Google","IBM"],
answer:"Netscape"
},

{
q:"Which HTML tag is used for JavaScript?",
options:["<script>","<js>","<javascript>","<code>"],
answer:"<script>"
},

{
q:"Which symbol is used for comments in JS?",
options:["//","<!-- -->","##","**"],
answer:"//"
},

{
q:"Which method selects element by id?",
options:["querySelector","getElementById","getElements","selectId"],
answer:"getElementById"
}

]

let currentQuestion = 0
let userAnswers = []

const questionEl = document.getElementById("question")
const optionsEl = document.getElementById("options")
const nextBtn = document.getElementById("nextBtn")
const progressBar = document.getElementById("progressBar")
const scoreboard = document.getElementById("scoreboard")

function loadQuestion(){

let q = questions[currentQuestion]

questionEl.innerText = q.q

optionsEl.innerHTML = ""

q.options.forEach(opt=>{

let div = document.createElement("div")
div.className="option"
div.innerText=opt

div.onclick=function(){

document.querySelectorAll(".option").forEach(o=>o.style.background="#e5e7eb")

div.style.background="#93c5fd"

userAnswers[currentQuestion]=opt

}

optionsEl.appendChild(div)

})

updateProgress()

}

function updateProgress(){

let percent = (currentQuestion/questions.length)*100

progressBar.style.width = percent+"%"

}

nextBtn.onclick=function(){

if(userAnswers[currentQuestion]==null){
alert("Please select an answer")
return
}

currentQuestion++

if(currentQuestion<questions.length){
loadQuestion()
}else{
showScoreboard()
}

}

function showScoreboard(){

document.getElementById("quizBox").style.display="none"

progressBar.style.width="100%"

let table = "<h2>Quiz Results</h2><table>"

table += "<tr><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Marks</th></tr>"

let score = 0

questions.forEach((q,i)=>{

let correct = q.answer
let user = userAnswers[i]

let mark = user===correct ? 1 : 0

if(mark) score++

table += `<tr class="${mark ? 'correct':'wrong'}">
<td>${q.q}</td>
<td>${user}</td>
<td>${correct}</td>
<td>${mark}</td>
</tr>`

})

table += `</table><h3>Total Score: ${score} / ${questions.length}</h3>`

scoreboard.innerHTML = table

}

loadQuestion()

</script>

</body>
</html>
